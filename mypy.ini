[mypy]

# Third-party libraries that ship without stubs or a py.typed marker.
[mypy-boto3.*,botocore.*,athena_runner.*]
ignore_missing_imports = True

# Test doubles (FakeAthena, FakeCatalog, ...) deliberately don't subclass the real protocols.
[mypy-src.pipelines.aws_access_cli.tests.*]
disable_error_code = arg-type, func-returns-value
