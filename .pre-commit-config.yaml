repos:
  - repo: local
    hooks:
      - id: md-line-length
        name: "markdown lines must be <=200 chars"
        language: system
        entry: python scripts/dev/hooks/check_md_line_length.py
        files: '\.md$'
        pass_filenames: true

      - id: md-reflow
        name: "markdown must be in fill-to-<=200 style (reflow_md)"
        language: system
        entry: python scripts/dev/reflow_md.py --check
        files: '\.md$'
        pass_filenames: true

      - id: py-code-review
        name: "AI review of staged .py changes (code-reviewer agent)"
        language: system
        entry: python scripts/dev/hooks/review_py_with_copilot.py
        files: '\.py$'
        pass_filenames: true
        verbose: true

      - id: story-archive-check
        name: "warn on complete-but-unarchived docs/plan/ stories"
        language: system
        entry: python scripts/dev/hooks/check_unarchived_stories.py
        files: 'docs/plan/.*/tasks\.md$'
        pass_filenames: false
        verbose: true

# NOTE (phase0): ruff/mypy/pytest-gate/bandit/detect-secrets hooks are deferred
# until pyproject.toml, tests/unit/, and src/ are (re)added to the python piece.
